name: Build

# CI verifies MiraCore against Java 21 and Paper 1.21.11.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiraCore-0.4.1
          path: build/libs/MiraCore-0.4.1.jar
          if-no-files-found: error

      - name: Publish v0.4.1 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.4.1 >/dev/null 2>&1; then
            gh release create v0.4.1 \
              build/libs/MiraCore-0.4.1.jar \
              --target "${{ github.sha }}" \
              --title "MiraCore v0.4.1" \
              --notes "MiraCore now owns the normal server-list MOTD and maintenance override, adds configurable maintenance countdown warnings and persisted reasons, kicks every connected player when maintenance activates, allows only bypass-permission users to rejoin, supports optional join MOTD/max-player/icon handling, and hardens scheduled maintenance expiry."
          fi
