name: Release v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 \
            build/libs/MiraCore-0.1.0.jar \
            --target main \
            --title "MiraCore v0.1.0" \
            --notes "MiraCore v0.1.0\n\nInitial shared infrastructure release for the Mira plugin ecosystem. Includes Bukkit API discovery, shared service registry, cooldown service, module health registry, configurable messaging, runtime diagnostics, module lifecycle events, /miracore status, /miracore test, /miracore reload, JUnit coverage, and Paper 1.21.11 / Java 21 support."
